system:
  name: "PaperPilot"
  version: "0.2.0"
  log_level: "INFO"
  work_dir: "outputs"

# One policy drives alignment, research, tool use, fork decisions, and summary.
# The evaluation judge is external to the Research AgentGraph.
model:
  backend: "deepseek"
  backend_sampling:
    deepseek:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0
    modules:
      research:
        temperature: 0.7
        max_tokens: 4096
      judge:
        temperature: 0.1
        max_tokens: 2048
  backend_mapping:
    research: "deepseek"
    judge: "deepseek"

research:
  vault_root: "memory"
  # Optional exact Obsidian Vault name. Omit it to open notes by absolute path.
  # vault_name: "PaperPilotVault"
  report_review:
    enabled: false
  limits:
    max_iterations: 8
    max_tool_calls: 12
    max_tool_output_chars: 12000
    max_children: 4
    max_fork_depth: 2
    max_total_threads: 7
    max_total_tool_calls: 36
    max_elapsed_seconds: 300.0
    max_total_tokens: 120000
    max_retries_per_action: 1
    max_total_retries: 6

chat:
  db_path: "data/chat.db"

tools:
  enabled:
    - web_search
    - browser
    - arxiv_reader
    - file_reader
    - calculator
    - notepad
  web_search:
    mock_mode: false
