system:
  name: "PaperPilot"
  version: "0.2.0"
  log_level: "INFO"
  work_dir: "outputs"

# One policy drives alignment, research, tool use, fork decisions, and summary.
# The evaluation judge is external to the Research AgentGraph.
model:
  backend: "deepseek"
  backend_sampling:
    deepseek:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0
    modules:
      research:
        temperature: 0.7
        max_tokens: 4096
      judge:
        temperature: 0.1
        max_tokens: 2048
  backend_mapping:
    research: "deepseek"
    judge: "deepseek"

research:
  # V2 remains opt-in: the isolated single-question gate improved after targeted
  # fixes but still did not meet the publication-quality threshold.
  architecture: "legacy"
  supervisor_v2:
    enabled: false
    max_initial_workers: 4
    max_research_waves: 3
    red_review_enabled: true
    max_red_review_rounds: 1
    max_citation_repair_rounds: 1
  vault_root: "memory"
  # S3 requires an explicit recoverable archive outside the active Vault.
  # Migration never permanently deletes this archive.
  legacy_archive_root: "legacy-archives"
  # Optional exact Obsidian Vault name. Omit it to open notes by absolute path.
  # vault_name: "PaperPilotVault"
  report_review:
    enabled: false
  limits:
    max_iterations: 18
    max_tool_calls: 30
    max_tool_output_chars: 24000
    max_children: 4
    max_fork_depth: 2
    max_total_threads: 10
    max_total_tool_calls: 96
    max_elapsed_seconds: 900.0
    max_total_tokens: 500000
    max_retries_per_action: 2
    max_total_retries: 12

# Full-content extraction is an independent opt-in rollout. Legacy behavior is
# retained until the isolated canary demonstrates a measurable evidence gain.
content_extraction:
  mode: "legacy"
  tavily_extract_fallback: false
  docling_enabled: false
  # Scanned-document OCR is intentionally out of scope for this personal project.
  ocr_enabled: false
  max_download_bytes: 12000000
  max_blocks: 24
  max_output_chars: 24000

chat:
  db_path: "data/chat.db"

runtime:
  # Workflow state/checkpoints and the thin registry share chat.db but use
  # independent tables. These values control confirmation lifecycle only.
  proposal_ttl_seconds: 86400
  terminal_retention_seconds: 604800
  lease_seconds: 60
  sweep_interval_seconds: 5
  # Polling interval used only while a caller waits for the durable Vault Writer.
  writer_coordination_interval_seconds: 0.1
  # Disposable FTS5 derivative data; Markdown in the Vault remains authoritative.
  retrieval_db_path: "data/retrieval.db"
  retrieval_reconciliation_seconds: 300
  # Optional local multilingual embeddings. Disabled by default: when enabled,
  # a missing or incompatible model safely falls back to the FTS5 index above.
  semantic_retrieval_enabled: false
  semantic_embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  semantic_local_files_only: true

tools:
  enabled:
    - web_search
    - browser
    - arxiv_reader
    - file_reader
    - calculator
    - notepad
  web_search:
    mock_mode: false
  evidence_acquisition:
    default_candidates: 8
    default_sources: 3
    max_sources: 6
    max_chars_per_source: 12000
