system:
  name: "PaperPilot"
  version: "0.2.0"
  log_level: "INFO"
  work_dir: "outputs"

model:
  backend: "deepseek"
  backend_sampling:
    deepseek:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0
    modules:
      research:
        temperature: 0.3
        max_tokens: 4096
        max_input_chars: 60000
      judge:
        temperature: 0.1
        max_tokens: 2048
  backend_mapping:
    research: "deepseek"
    judge: "deepseek"

research:
  architecture: "legacy"
  structured_report:
    enabled: true
  homogeneous_fork:
    enabled: true
    explicit_control_decision: true
    budget_leases_enabled: false
    reconsider_after_local_rounds: 2
    parent_merge_reserve_tokens: 50000
    root_final_max_tokens: 32768
    root_final_output_token_budget: 50000
    initial_child_lease_tokens: 60000
    child_topup_tokens: 25000
    max_child_lease_tokens: 125000
  shared_comparison:
    enabled: false
  supervisor_v2:
    enabled: false
    max_initial_workers: 4
    max_research_waves: 1
    red_review_enabled: false
    max_red_review_rounds: 0
    max_citation_repair_rounds: 1
  vault_root: "outputs/evaluation/researchbench-root-agent-tech-two-r4/vault"
  legacy_archive_root: "outputs/evaluation/researchbench-root-agent-tech-two-r4/legacy-archives"
  report_review:
    enabled: false
  limits:
    max_iterations: 18
    max_tool_calls: 30
    max_tool_output_chars: 24000
    max_children_per_agent: 5
    max_fork_depth: 2
    max_concurrent_agents: 10
    max_total_agents: 10
    max_total_tool_calls: 96
    max_elapsed_seconds: 1200.0
    max_total_tokens: 500000
    max_retries_per_action: 2
    max_total_retries: 12

content_extraction:
  mode: "structured"
  tavily_extract_fallback: true
  docling_enabled: false
  ocr_enabled: false
  max_download_bytes: 12000000
  max_blocks: 24
  max_output_chars: 24000

chat:
  db_path: "data/chat.db"

runtime:
  proposal_ttl_seconds: 86400
  terminal_retention_seconds: 604800
  lease_seconds: 60
  sweep_interval_seconds: 5
  writer_coordination_interval_seconds: 0.1
  retrieval_db_path: "outputs/evaluation/researchbench-root-agent-tech-two-r4/retrieval.db"
  retrieval_reconciliation_seconds: 300
  semantic_retrieval_enabled: false
  semantic_embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  semantic_local_files_only: true

tools:
  enabled:
    - acquire_evidence
    - arxiv_reader
    - file_reader
    - calculator
    - notepad
  web_search:
    mock_mode: false
  evidence_acquisition:
    default_candidates: 8
    default_sources: 3
    max_sources: 6
    max_chars_per_source: 12000
