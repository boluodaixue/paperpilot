<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperPilot — 递归深度研究</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f6fa; color: #222; }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧边栏 ---------- */
  #sidebar { width: 248px; min-width: 248px; background: #1f2937; color: #e5e7eb; display: flex; flex-direction: column; }
  #sidebar .brand { padding: 16px 16px 10px; font-size: 17px; font-weight: 700; color: #fff; }
  #sidebar .brand small { display: block; font-size: 11px; font-weight: 400; color: #9ca3af; margin-top: 2px; }
  #newSessionBtn { margin: 6px 12px 10px; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
                   background: #2563eb; color: #fff; font-size: 13px; font-weight: 600; }
  #newSessionBtn:hover { background: #1d4ed8; }
  #sessionList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .sess-row { position: relative; padding: 9px 10px; margin-bottom: 3px; border-radius: 8px; cursor: pointer; font-size: 12px; color: #d1d5db; }
  .sess-row:hover { background: #374151; }
  .sess-row.active { background: #2563eb; color: #fff; }
  .sess-row.pinned .t::before { content: '📌 '; }
  .sess-row.dragging { opacity: .45; }
  .sess-row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 52px; }
  .sess-row .m { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .sess-row.active .m { color: #bfdbfe; }
  .sess-row .actions { position: absolute; right: 6px; top: 6px; display: none; gap: 2px; background: rgba(31,41,55,.92); border-radius: 6px; padding: 1px; }
  .sess-row:hover .actions { display: flex; }
  .sess-row.active .actions { background: rgba(37,99,235,.95); }
  .sess-row .actions button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 4px; color: inherit; }
  .sess-row .actions button:hover { background: rgba(255,255,255,.22); }
  .sess-row .rename-input { width: 100%; padding: 4px 6px; border-radius: 6px; border: 1px solid #2563eb; font-size: 12px; }

  /* ---------- 主区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatHeader { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; font-size: 14px; font-weight: 600; }
  #chatHeader .sub { font-size: 11px; color: #9ca3af; font-weight: 400; margin-left: 8px; }

  #messages { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .msg { max-width: 72%; margin-bottom: 12px; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.65; }
  .msg.user { margin-left: auto; background: #2563eb; color: #fff; }
  .msg.assistant { margin-right: auto; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.05); white-space: pre-wrap; }
  .msg.thinking { font-style: italic; color: #9ca3af; background: transparent; border: none; }
  .progress-line { font-family: Consolas, monospace; font-size: 12px; color: #64748b; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress-line.state { color: #2563eb; }
  .progress-line.task_done { color: #059669; }
  .progress-line.evidence { color: #b45309; }
  .progress-line.synthesis { color: #7c3aed; }
  .progress-line.done { color: #059669; font-weight: 700; }
  .progress-line.error { color: #dc2626; font-weight: 700; }

  /* ---------- 研究方案卡 ---------- */
  #proposalCard { margin: 0 22px; background: #fff; border: 1px solid #d1d5db; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #proposalCard .head { padding: 8px 14px; background: #eef2ff; font-size: 13px; font-weight: 700; color: #3730a3; }
  #proposalCard .body { padding: 12px 14px; }
  #proposalCard label { display: block; font-size: 12px; color: #6b7280; margin: 8px 0 3px; }
  #proposalCard textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 7px 9px; font-size: 13px; resize: vertical; font-family: inherit; }
  #proposalCard textarea.focus { height: auto; }
  #proposalCard .actions { padding: 10px 14px; border-top: 1px solid #f3f4f6; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .btn { padding: 9px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: #6b7280; }

  /* ---------- 报告卡 ---------- */
  .report-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .report-card .rc-head { display: flex; justify-content: flex-end; padding: 8px 12px 0; }
  .report-card .rc-head .btn-ghost { font-size: 12px; padding: 5px 12px; border: 1px solid #e5e7eb; border-radius: 6px; }
  .report-card .rc-filter { padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
  .report-card .tabs { display: flex; border-bottom: 2px solid #e5e7eb; background: #f9fafb; }
  .report-card .tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 600; color: #6b7280; border-bottom: 3px solid transparent; }
  .report-card .tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #fff; }
  .report-card .tabbody { padding: 18px; display: none; font-size: 14px; }
  .report-card .tabbody.active { display: block; }
  #reportContent { line-height: 1.75; }
  #reportContent h1, #reportContent h2, #reportContent h3 { margin: 16px 0 8px; }
  #reportContent p { margin: 7px 0; }
  #reportContent ul, #reportContent ol { margin: 7px 0 7px 24px; }
  #reportContent table { border-collapse: collapse; margin: 8px 0; }
  #reportContent th, #reportContent td { border: 1px solid #d1d5db; padding: 5px 9px; }
  #reportContent a { color: #2563eb; }
  #reportContent code { background: #f3f4f6; padding: 2px 5px; border-radius: 4px; }
  #reportContent blockquote { border-left: 4px solid #e5e7eb; padding-left: 12px; color: #6b7280; }

  table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data th, table.data td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; vertical-align: top; }
  table.data th { background: #f9fafb; font-weight: 600; }
  .cite-ok { color: #059669; font-weight: 600; }
  .cite-no { color: #b45309; }
  .evidence-note { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .empty { color: #9ca3af; text-align: center; padding: 34px 0; font-size: 13px; }

  /* ---------- 输入栏 ---------- */
  #inputBar { display: flex; gap: 10px; padding: 12px 22px 16px; }
  #msgInput { flex: 1; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 14px; }
  #msgInput:focus { outline: none; border-color: #2563eb; }
  #sendBtn { padding: 0 26px; }
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="brand">PaperPilot<small>同质 Agent 递归深度研究</small></div>
    <button id="newSessionBtn">＋ 新建会话</button>
    <div id="sessionList"></div>
  </aside>

  <!-- 主区 -->
  <main id="main">
    <div id="chatHeader">会话<span class="sub" id="chatHeaderSub">输入问题开始</span></div>
    <div id="messages"></div>

    <!-- 研究方案确认卡（位于输入框上方） -->
    <div id="proposalCard" style="display:none">
      <div class="head">📋 研究方案确认</div>
      <div class="body">
        <label>研究目标</label><textarea id="p_objective" rows="2"></textarea>
        <label>研究范围（每行一项）</label><textarea id="p_scope" rows="3"></textarea>
        <label>研究方向（每行一项）</label><textarea id="p_directions" rows="3"></textarea>
        <label>限制条件（每行一项）</label><textarea id="p_constraints" rows="2"></textarea>
        <label>预期输出</label><textarea id="p_output" rows="2"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="reClarifyBtn" onclick="submitBriefChanges()">提交修改</button>
        <button class="btn btn-primary" id="startBtn" onclick="startResearch()">开始研究</button>
      </div>
    </div>

    <div id="inputBar">
      <input type="text" id="msgInput" placeholder="输入研究问题，或说明如何修改研究方向…" autocomplete="off">
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </main>
</div>

<script>
// ------------------------------------------------------------------
// 全局状态
// ------------------------------------------------------------------
let currentSessionId = null;   // 当前会话
let currentProposal = null;    // {brief, task_id} 待确认说明
let currentReportData = null;  // 当前报告数据
let runningTask = null;        // {task_id, session_id} 正在运行的研究
let eventSource = null;
const eventCursors = {};

const $ = id => document.getElementById(id);

// ------------------------------------------------------------------
// 侧边栏
// ------------------------------------------------------------------
async function loadSessions() {
  let sessions = [];
  try {
    const r = await fetch('/api/sessions');
    sessions = await r.json();
  } catch (e) {}
  const list = $('sessionList');
  list.innerHTML = '';
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'sess-row' + (s.pinned ? ' pinned' : '') +
      (s.session_id === currentSessionId ? ' active' : '');
    div.draggable = true;
    div.dataset.sid = s.session_id;
    div.innerHTML = `
      <div class="t">${escapeHtml(s.title || s.session_id)}</div>
      <div class="m">${fmtTime(s.last_update)} · ${s.count} 条</div>
      <div class="actions">
        <button title="重命名" data-act="rename">✏️</button>
        <button title="${s.pinned ? '取消置顶' : '置顶'}" data-act="pin">📌</button>
        <button title="删除" data-act="del">🗑️</button>
      </div>`;
    div.querySelector('.actions').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'rename') renameSession(s.session_id, s.title || '');
      else if (act === 'pin') togglePin(s.session_id, !s.pinned);
      else if (act === 'del') deleteSession(s.session_id);
    });
    div.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return;
      selectSession(s.session_id);
    });
    div.addEventListener('dragstart', (e) => { dragSid = s.session_id; div.classList.add('dragging'); });
    div.addEventListener('dragend', () => div.classList.remove('dragging'));
    div.addEventListener('dragover', (e) => e.preventDefault());
    div.addEventListener('drop', (e) => { e.preventDefault(); reorderSessions(dragSid, s.session_id); });
    list.appendChild(div);
  }
}

let dragSid = null;

async function renameSession(sid, currentTitle) {
  const row = document.querySelector(`.sess-row[data-sid="${CSS.escape(sid)}"]`);
  if (!row) return;
  const t = row.querySelector('.t');
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = currentTitle;
  t.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const commit = async (save) => {
    if (done) return; done = true;
    const val = input.value.trim();
    if (save && val && val !== currentTitle) {
      await fetch(`/api/sessions/${encodeURIComponent(sid)}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: val }),
      });
    }
    loadSessions();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') commit(true);
    else if (e.key === 'Escape') commit(false);
  });
  input.addEventListener('blur', () => commit(true));
}

async function togglePin(sid, pinned) {
  await fetch(`/api/sessions/${encodeURIComponent(sid)}/pin`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pinned }),
  });
  loadSessions();
}

async function deleteSession(sid) {
  if (!confirm('删除该会话的聊天记录？已写入 Memory Store 的共享研究笔记会保留。')) return;
  await fetch(`/api/sessions/${encodeURIComponent(sid)}`, { method: 'DELETE' });
  if (currentSessionId === sid) newSession();
  loadSessions();
}

async function reorderSessions(fromSid, toSid) {
  const rows = [...document.querySelectorAll('#sessionList .sess-row')];
  const ids = rows.map(r => r.dataset.sid);
  const fi = ids.indexOf(fromSid), ti = ids.indexOf(toSid);
  if (fi < 0 || ti < 0 || fi === ti) return;
  ids.splice(fi, 1);
  ids.splice(ti, 0, fromSid);
  await fetch('/api/sessions/order', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_ids: ids }),
  });
  loadSessions();
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function newSession() {
  currentSessionId = null; currentProposal = null; currentReportData = null; runningTask = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  $('messages').innerHTML = '';
  $('proposalCard').style.display = 'none';
  $('chatHeaderSub').textContent = '输入问题开始';
  $('msgInput').placeholder = '输入研究问题，例如：transformer 的来历与发展';
  $('msgInput').focus();
  loadSessions();
}

// ------------------------------------------------------------------
// 会话选择（历史）
// ------------------------------------------------------------------
async function selectSession(sid) {
  currentSessionId = sid; currentProposal = null; currentReportData = null;
  if (eventSource) { eventSource.close(); eventSource = null; }
  $('messages').innerHTML = '';
  $('proposalCard').style.display = 'none';
  $('chatHeaderSub').textContent = `会话 ${sid}`;
  const r = await fetch(`/api/sessions/${encodeURIComponent(sid)}/messages`);
  const msgs = await r.json();
  $('messages').innerHTML = '';
  if (!msgs.length) { loadSessions(); return; }
  // 跳过 proposal/report（单独卡片渲染），其余当气泡显示
  for (const m of msgs) renderStoredMessage(m);

  // 该会话是否有进行中的研究？本地 runningTask 优先，其次向服务器查询
  let task = (runningTask && runningTask.session_id === sid) ? runningTask : null;
  if (!task) {
    try {
      const tr = await fetch(`/api/sessions/${encodeURIComponent(sid)}/active-task`);
      const td = await tr.json();
      if (td.task_id) { task = { task_id: td.task_id, session_id: sid, status: td.status }; runningTask = task; }
    } catch (e) { /* 忽略 */ }
  }
  if (task && task.status === 'running') {
    appendProgress({ type: 'state', state: '研究进行中（已恢复连接）' });
    openEventStream(task.task_id);
    loadSessions();
    return;
  }
  if (task && task.status === 'waiting_confirmation') {
    showProposalFromHistory(msgs);
    loadSessions();
    return;
  }

  // 按最后一条消息决定尾部状态：proposal → 恢复确认卡；report → 恢复报告卡
  const last = msgs[msgs.length - 1];
  if (last.kind === 'proposal') {
    showProposalFromHistory(msgs);
  } else if (last.kind === 'report') {
    currentReportData = await loadReportData(sid, last);
    renderReportCard(currentReportData);
  }
  loadSessions();
}

function renderStoredMessage(m) {
  if (m.kind === 'proposal') return; // 用确认卡单独渲染
  if (m.kind === 'report') return;   // 用报告卡单独渲染
  appendBubble(m.role, m.content);
}

function appendBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  $('messages').appendChild(div);
  scrollToBottom();
}
function scrollToBottom() {
  const box = $('messages');
  box.scrollTop = box.scrollHeight;
}

// ------------------------------------------------------------------
// 发送消息 → 用户对齐
// ------------------------------------------------------------------
async function sendMessage() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || sendLock) return;
  input.value = '';
  appendBubble('user', text);

  const el = document.createElement('div');
  el.className = 'msg thinking'; el.textContent = '正在思考…';
  $('messages').appendChild(el); scrollToBottom();

  sendLock = true;
  try {
    const r = await fetch('/api/alignment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: currentSessionId,
        task_id: currentProposal ? currentProposal.task_id : null,
        message: text,
      }),
    });
    const data = await r.json();
    el.remove();
    if (!r.ok) { appendBubble('assistant', data.detail || '研究方向对齐失败'); return; }

    currentSessionId = data.session_id;
    currentProposal = { brief: data.brief || {}, task_id: data.task_id };
    showProposalCard(currentProposal);
    $('chatHeaderSub').textContent = `会话 ${data.session_id}`;
    loadSessions();
  } catch (e) {
    el.remove();
    appendBubble('assistant', '请求失败，请重试');
  } finally {
    sendLock = false;
  }
}

// ------------------------------------------------------------------
// 研究方案确认卡
// ------------------------------------------------------------------
function showProposalCard(p) {
  const inputLock = !p;
  const card = $('proposalCard');
  card.style.display = 'block';
  setProposalFields(p);
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setProposalFields(p) {
  const brief = p.brief || {};
  $('p_objective').value = brief.objective || '';
  $('p_scope').value = (brief.scope || []).join('\n');
  $('p_directions').value = (brief.directions || []).join('\n');
  $('p_constraints').value = (brief.constraints || []).join('\n');
  $('p_output').value = brief.expected_output || '';
}

function lines(id) { return $(id).value.split(/\n|，|,/).map(s=>s.trim()).filter(Boolean); }
function readBriefFromForm() {
  return {
    ...(currentProposal ? currentProposal.brief : {}),
    objective: $('p_objective').value.trim(),
    scope: lines('p_scope'),
    directions: lines('p_directions'),
    constraints: lines('p_constraints'),
    expected_output: $('p_output').value.trim(),
  };
}
function showProposalFromHistory(msgs) {
  const propMsg = msgs.filter(m => m.kind === 'proposal').slice(-1)[0];
  if (!propMsg) return;
  try {
    const p = JSON.parse(propMsg.content);
    currentProposal = {brief: p.brief || {}, task_id: p.task_id};
    showProposalCard(currentProposal);
  } catch (e) { /* 解析失败不弹卡 */ }
}
async function submitBriefChanges() {
  if (!currentProposal) return;
  const feedback = '请按以下完整内容修改研究说明：' + JSON.stringify(readBriefFromForm());
  const r = await fetch('/api/alignment', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({session_id: currentSessionId, task_id: currentProposal.task_id, message: feedback}),
  });
  const data = await r.json();
  if (!r.ok) { alert(data.detail || '修改失败'); return; }
  currentProposal = {brief: data.brief || {}, task_id: data.task_id};
  showProposalCard(currentProposal);
}

// ------------------------------------------------------------------
// 开始研究
// ------------------------------------------------------------------
async function startResearch() {
  if (!currentProposal) return;
  if (JSON.stringify(readBriefFromForm()) !== JSON.stringify(currentProposal.brief)) {
    alert('研究说明已编辑，请先提交修改并等待更新后的说明。'); return;
  }
  const taskId = currentProposal.task_id;

  // 记录到会话：研究中
  $('proposalCard').style.display = 'none'; currentProposal = null;
  appendProgress({ type: 'state', state: '已提交，等待调度…' });

  const r = await fetch('/api/research', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task_id: taskId, session_id: currentSessionId }),
  });
  const data = await r.json();
  if (!r.ok) { appendProgress({ type: 'error', message: data.detail || '启动失败' }); return; }
  runningTask = { task_id: data.task_id, session_id: currentSessionId, status: data.status };
  openEventStream(data.task_id);
}

// ------------------------------------------------------------------
// SSE 进度流
// ------------------------------------------------------------------
function openEventStream(task_id) {
  if (eventSource) eventSource.close();
  const cursor = eventCursors[task_id] || 0;
  eventSource = new EventSource(`/api/tasks/${task_id}/events?cursor=${cursor}`);
  eventSource.onmessage = (e) => {
    if (!e.data) return;
    const ev = JSON.parse(e.data);
    if (ev.sequence) eventCursors[task_id] = ev.sequence;
    appendProgress(ev);
    if (ev.type === 'done') {
      eventSource.close(); eventSource = null;
      runningTask = null;
      fetchResult(task_id);
    } else if (ev.type === 'error') {
      eventSource.close(); eventSource = null;
      runningTask = null;
    }
  };
  eventSource.onerror = () => {
    eventSource.close(); eventSource = null;
    if (runningTask && runningTask.task_id === task_id) {
      setTimeout(() => openEventStream(task_id), 1000);
    }
  };
}

function appendProgress(ev) {
  const div = document.createElement('div');
  div.className = 'progress-line ' + (ev.type || '');
  const t = new Date().toLocaleTimeString();
  switch (ev.type) {
    case 'state': div.textContent = `[${t}] ▸ ${ev.state}`; break;
    case 'confirmed': div.textContent = `[${t}] ✓ 研究说明已确认`; break;
    case 'agent_started': div.textContent = `[${t}] ▸ Agent 开始（层级 ${ev.depth}，${ev.thread_id}）`; break;
    case 'tool_finished': div.textContent = `[${t}] ${ev.ok?'✓':'✗'} 工具 ${ev.tool}（重试 ${ev.retries||0}）`; break;
    case 'fork_finished': div.textContent = `[${t}] ⇄ 子研究汇聚：接受 ${ev.accepted}，拒绝 ${ev.rejected}`; break;
    case 'agent_finished': div.textContent = `[${t}] ✓ Agent 完成（${ev.status}）`; break;
    case 'agent_failed': div.textContent = `[${t}] ✗ Agent 失败：${ev.error||''}`; break;
    case 'done': div.textContent = `[${t}] ✅ 研究完成`; break;
    case 'error': div.textContent = `[${t}] ❌ ${ev.message}`; break;
    default: div.textContent = `[${t}] ${JSON.stringify(ev)}`;
  }
  $('messages').appendChild(div);
  scrollToBottom();
}
// ------------------------------------------------------------------
// 结果获取与报告卡
// ------------------------------------------------------------------
async function fetchResult(task_id) {
  const r = await fetch(`/api/tasks/${task_id}/result`);
  const data = await r.json();
  if (data.transport_status !== 'done') {
    if (data.message) appendProgress({ type: 'error', message: data.message });
    return;
  }
  currentReportData = data;
  renderReportCard(data);
  loadSessions();
}

async function loadReportData(sid, reportMsg) {
  let ev = [];
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(sid)}/evidence`);
    const d = await r.json();
    ev = d;
  } catch (e) {}
  return { report_md: reportMsg.content, evidence: ev.evidence || [], session_id: sid };
}

function renderReportCard(data) {
  // 移除旧的报告卡片
  const oldCards = document.querySelectorAll('.report-card');
  oldCards.forEach(c => c.remove());

  const card = document.createElement('div');
  card.className = 'report-card';
  card.innerHTML = `
    <div class="tabs">
      <div class="tab active" data-tab="report" onclick="switchTab(this,'report')">报告</div>
      <div class="tab" data-tab="evidence" onclick="switchTab(this,'evidence')">证据索引</div>
    </div>
    <div class="tabbody active" data-name="report"><div class="rc-report"></div></div>
    <div class="tabbody" data-name="evidence"><div class="rc-evidence"></div></div>`;
  $('messages').appendChild(card);

  card.querySelector('.rc-report').innerHTML = marked.parse(data.report_md || '（无报告内容）');
  renderEvidenceTable(card.querySelector('.rc-evidence'), data.evidence || [], data.report_md || '');
  scrollToBottom();
}

function switchTab(tabEl, name) {
  const card = tabEl.closest('.report-card');
  card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  card.querySelectorAll('.tabbody').forEach(t => t.classList.toggle('active', t.dataset.name === name));
}

function renderEvidenceTable(container, evidence, reportMd) {
  if (!evidence.length) { container.innerHTML = '<div class="empty">本会话暂无证据</div>'; return; }
  let html = '';
  for (const ev of evidence) {
    if (ev.markdown) {
      html += `<div class="evidence-note"><small>${escapeHtml(ev.path||'')}</small>${marked.parse(ev.markdown)}</div>`;
    } else {
      html += `<div class="evidence-note"><b>${escapeHtml(ev.finding||ev.evidence_id||'Evidence')}</b>` +
        `<div>${escapeHtml(ev.title||'')} · ${escapeHtml(ev.source_ref||'')}</div>` +
        `<small>${escapeHtml(ev.locator||'')}</small></div>`;
    }
  }
  container.innerHTML = html;
}

// ------------------------------------------------------------------
// 工具
// ------------------------------------------------------------------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
let sendLock = false;

// 初始化
$('newSessionBtn').onclick = newSession;
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
loadSessions();
newSession();
</script>
